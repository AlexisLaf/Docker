services:
    backend:
        build: "backend"
        networks:
          - database-backend
        depends_on:
          database:
            condition: service_healthy
            restart: true
    database:
        build: "Database"
        networks:
          - database-backend
          - Server-api
        volumes:
          - dbvol:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
          interval: 10s
          retries: 5
          start_period: 30s
          timeout: 10s

    httpd:
        build: "Server"
        ports:
          - "80:80"
        networks:
          - Server-api

networks:
  database-backend: {}
  Server-api: {}

volumes:
  dbvol :
