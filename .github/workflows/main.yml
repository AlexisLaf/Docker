name: Build and Sonar

on:
  #to begin you want to launch this job in main and develop
  push:
    branches: "main"
  pull_request:

jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: maximepakula/tp-devops-correction-docker
        #  sparse-checkout: TP2/tp-devops-correction-docker

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: |
          mvn clean verify --file ./simple-api/pom.xml
        
      - name: SonarCloud
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=dockerprojkey -Dsonar.organization=afraidorgkey -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }}  --file ./simple-api/pom.xml

#Change to relaunch